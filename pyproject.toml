[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compost-language-experiment"
version = "0.1.0"
description = "Signal-validation experiment for measuring linguistic convergence in AI-assisted writing"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
